<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Galeria de Imagens</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <img
      class="gallery__image-background"
      src="assets/images/sunset.webp"
      alt="Lago refletindo a floresta e o sol se pondo em meio as montanhas"
    />

    <div class="gallery__container-content">
      <header class="gallery__header">
        <i class="fa-solid fa-photo-film gallery__image-icon"></i>
        <ul class="gallery__list-categories">
          <li class="gallery__item">
            <button class="gallery__category" type="button">Todas</button>
          </li>
          <li class="gallery__item">
            <button class="gallery__category" type="button">Arquitetura</button>
          </li>
          <li class="gallery__item">
            <button class="gallery__category" type="button">Natureza</button>
          </li>
          <li class="gallery__item">
            <button class="gallery__category" type="button">Verão</button>
          </li>
          <li class="gallery__item">
            <button class="gallery__category" type="button">Pessoas</button>
          </li>
          <li class="gallery__item">
            <button class="gallery__category" type="button">Viagem</button>
          </li>
        </ul>
      </header>

      <main>
        <label class="gallery__search">
          <i class="fa-solid fa-magnifying-glass gallery__search-icon" aria-hidden="true"></i>
          <input
            class="gallery__input-search"
            type="text"
            name="search"
            placeholder="Buscar"
            aria-label="Buscar imagens"
          />
        </label>
        <h1 class="gallery__title">Galeria</h1>
        <div class="gallery__grid">
          <!-- Imagens com scroll vertical -->
          <div class="gallery__card">
            <img class="gallery__image" src="assets/images/arquitetura-01.webp" alt="">
            <div class="gallery__tags">
              <p class="gallery__tag"></p>
              <p class="gallery__tag"></p>
            </div>
          </div>
          <div class="gallery__card">
            <img class="gallery__image" src="assets/images/arquitetura-01.webp" alt="">
            <div class="gallery__tags">
              <p class="gallery__tag"></p>
              <p class="gallery__tag"></p>
            </div>
          </div>
          <div class="gallery__card">
            <img class="gallery__image" src="assets/images/arquitetura-01.webp" alt="">
            <div class="gallery__tags">
              <p class="gallery__tag"></p>
              <p class="gallery__tag"></p>
            </div>
          </div>
          <div class="gallery__card">
            <img class="gallery__image" src="assets/images/arquitetura-01.webp" alt="">
            <div class="gallery__tags">
              <p class="gallery__tag"></p>
              <p class="gallery__tag"></p>
            </div>
          </div>
          <div class="gallery__card">
            <img class="gallery__image" src="assets/images/arquitetura-01.webp" alt="">
            <div class="gallery__tags">
              <p class="gallery__tag"></p>
              <p class="gallery__tag"></p>
            </div>
          </div>
          <div class="gallery__card">
            <img class="gallery__image" src="assets/images/arquitetura-01.webp" alt="">
            <div class="gallery__tags">
              <p class="gallery__tag"></p>
              <p class="gallery__tag"></p>
            </div>
          </div>
          <div class="gallery__card">
            <img class="gallery__image" src="assets/images/arquitetura-01.webp" alt="">
            <div class="gallery__tags">
              <p class="gallery__tag"></p>
              <p class="gallery__tag"></p>
            </div>
          </div>
          <div class="gallery__card">
            <img class="gallery__image" src="assets/images/arquitetura-01.webp" alt="">
            <div class="gallery__tags">
              <p class="gallery__tag"></p>
              <p class="gallery__tag"></p>
            </div>
          </div>
        </div>
      </main>

      <footer class="gallery__footer">
        <p class="gallery__footer-paragraph">
          &copy;Desenvolvido por Ricardo Zampolo Bertolucci Cruz - 2026
        </p>
      </footer>
    </div>

    <div class="modal is-hidden">
      <i class="fa-solid fa-xmark modal__close"></i>
      <i class="fa-solid fa-angle-left modal__arrow-left"></i>
      <div class="modal__box">
        <img src="assets/images/arquitetura-05.webp" alt="">
      </div>
      <i class="fa-solid fa-angle-right modal__arrow-right"></i>
    </div>

    <script
      src="https://kit.fontawesome.com/c563b4c310.js"
      crossorigin="anonymous"
    ></script>
    <script src="js/data.js"></script>
    <script src="js/gallery.js"></script>
  </body>
</html>
